plugins {
    id 'java'
    id 'com.ibm.cics.bundle' version '1.0.9'
}

version = '1.0.0'

description = 'Host Zowe team configuration files in CICS'

processResources {
    def portNumber = providers.environmentVariable('PORT_NUMBER')

    inputs.property('portNumber', portNumber)

    filesMatching('**/ZOWECFG.tcpipservice') {
        expand(portNumber: portNumber.get())
    }
}

cicsBundle {
    build {
        bundlePartsDirectory = '../../build/resources/main/bundleParts'
    }
    deploy {
        cicsplex = System.getenv("CICS_PLEX") ?: ""
        region   = System.getenv("CICS_REGION") ?: ""
        bunddef  = System.getenv("CICS_BUNDLE") ?: ""
        csdgroup = System.getenv("CICS_CSD_GROUP") ?: ""
        url      = System.getenv("CICS_CMCI_URL") ?: ""
        username = System.getenv("CICS_USER") ?: ""
        password = System.getenv("CICS_PASSWORD") ?: ""
        insecure = System.getenv("INSECURE_DEPLOY") ?: "false"
    }
}

